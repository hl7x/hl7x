<svg class="hl7x-mark" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 380 320" width="480" height="404" role="img" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
<title>HL7X</title>
<desc>The HL7 v2 encoding characters field types out in white. The two field separator pipes and the component separator caret light up mint green, the remaining characters dissolve, the pipes rotate and cross into an X while the caret rises above them, and the strip contracts into the HL7X icon.</desc>

<!--
  HL7X animated logo mark.

  Colours:  mint #7ef0c8 · ink #ffffff · tile #0b120f · panel #101c17
  Duration: 4.2s, plays once, freezes on the mark.

  To loop instead, change the four `1 both` occurrences below to
  `infinite both` and add a fade-out. Not recommended in a README.

  IMPORTANT — how to use this on GitHub:
  Commit this file and reference it as an IMAGE:
      <img src="assets/hl7x-logo-animation.svg" width="480" alt="HL7X">
  Do NOT paste the markup inline in the README. GitHub's markdown
  sanitiser strips <style> from inline SVG and you'll get a blank frame.
  As an <img>, the browser renders it in secure animated mode: CSS
  animation runs, scripts don't. That's exactly what this file needs.
-->

<style>
.hl7x-mark .st    { transform-box: view-box; transform-origin: 0 0 }
.hl7x-mark .tile  { transform-box: view-box; transform-origin: 190px 187px }
.hl7x-mark .ch    { font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, "Liberation Mono", monospace;
                    font-size: 52px; font-weight: 500; fill: #ffffff }

.hl7x-mark .tile  { animation: hl7x-tile  4.2s cubic-bezier(.7,0,.2,1) 1 both }
.hl7x-mark .panel { animation: hl7x-panel 4.2s cubic-bezier(.7,0,.2,1) 1 both }
.hl7x-mark .dim   { animation: hl7x-dim   4.2s cubic-bezier(.7,0,.2,1) 1 both }
.hl7x-mark .p0    { animation: hl7x-p0    4.2s cubic-bezier(.7,0,.2,1) 1 both }
.hl7x-mark .p5    { animation: hl7x-p5    4.2s cubic-bezier(.7,0,.2,1) 1 both }
.hl7x-mark .caret { animation: hl7x-hop   4.2s cubic-bezier(.7,0,.2,1) 1 both }
.hl7x-mark .ha    { animation: hl7x-ha    4.2s cubic-bezier(.7,0,.2,1) 1 both }
.hl7x-mark .hb    { animation: hl7x-hb    4.2s cubic-bezier(.7,0,.2,1) 1 both }

/* Left field separator: types in white, lights up mint, becomes the "\" arm of the X. */
@keyframes hl7x-p0 {
  0%,5.95%      { opacity:0;  fill:#ffffff; transform: translate(90px,187px)  rotate(0deg)  scale(.55) }
  10.29%,27.43% { opacity:.5; fill:#ffffff; transform: translate(90px,187px)  rotate(0deg)  scale(1) }
  35.71%        { opacity:1;  fill:#7ef0c8; transform: translate(90px,187px)  rotate(0deg)  scale(1.12) }
  40%,60.76%    { opacity:1;  fill:#7ef0c8; transform: translate(90px,187px)  rotate(0deg)  scale(1) }
  79.24%        { opacity:1;  fill:#7ef0c8; transform: translate(190px,206px) rotate(49deg) scale(1.38) }
  84.57%,100%   { opacity:1;  fill:#7ef0c8; transform: translate(190px,206px) rotate(45deg) scale(1.3) }
}
/* Right field separator: same beats, becomes the "/" arm. */
@keyframes hl7x-p5 {
  0%,19.05%     { opacity:0;  fill:#ffffff; transform: translate(290px,187px) rotate(0deg)   scale(.55) }
  23.33%,27.43% { opacity:.5; fill:#ffffff; transform: translate(290px,187px) rotate(0deg)   scale(1) }
  35.71%        { opacity:1;  fill:#7ef0c8; transform: translate(290px,187px) rotate(0deg)   scale(1.12) }
  40%,60.76%    { opacity:1;  fill:#7ef0c8; transform: translate(290px,187px) rotate(0deg)   scale(1) }
  79.24%        { opacity:1;  fill:#7ef0c8; transform: translate(190px,206px) rotate(-49deg) scale(1.38) }
  84.57%,100%   { opacity:1;  fill:#7ef0c8; transform: translate(190px,206px) rotate(-45deg) scale(1.3) }
}
/* Caret arms. Position and colour live apart: the two arms carry their own
   transforms, the wrapping group carries opacity and fill so they never
   overlap translucently and can't drift out of colour sync. */
@keyframes hl7x-ha {
  0%,8.57%      { transform: translate(126.78px,186.18px) rotate(-41.82deg) scale(.55) }
  12.86%,27.43% { transform: translate(122.5px,185.5px)   rotate(-41.82deg) scale(1) }
  35.71%        { transform: translate(121.36px,185.32px) rotate(-41.82deg) scale(1.12) }
  40%,60.76%    { transform: translate(122.5px,185.5px)   rotate(-41.82deg) scale(1) }
  79.24%        { transform: translate(176.89px,135.93px) rotate(-41.82deg) scale(1.38) }
  84.57%,100%   { transform: translate(177.65px,142.05px) rotate(-41.82deg) scale(1.3) }
}
@keyframes hl7x-hb {
  0%,8.57%      { transform: translate(137.23px,186.18px) rotate(41.82deg) scale(.55) }
  12.86%,27.43% { transform: translate(141.5px,185.5px)   rotate(41.82deg) scale(1) }
  35.71%        { transform: translate(142.64px,185.32px) rotate(41.82deg) scale(1.12) }
  40%,60.76%    { transform: translate(141.5px,185.5px)   rotate(41.82deg) scale(1) }
  79.24%        { transform: translate(203.11px,135.93px) rotate(41.82deg) scale(1.38) }
  84.57%,100%   { transform: translate(202.35px,142.05px) rotate(41.82deg) scale(1.3) }
}
@keyframes hl7x-hop {
  0%,8.57%      { opacity:0;  fill:#ffffff }
  12.86%,27.43% { opacity:.5; fill:#ffffff }
  35.71%,100%   { opacity:1;  fill:#7ef0c8 }
}
/* The ~ \ & characters: type in white, never light up, drop away. */
@keyframes hl7x-dim {
  0%            { opacity:0;  transform: translate(var(--x),187px) scale(.6) }
  4.29%,34.48%  { opacity:.5; transform: translate(var(--x),187px) scale(1) }
  46.48%,100%   { opacity:0;  transform: translate(var(--x),209px) scale(.85) }
}
/* Wide message strip contracts into the square icon tile. */
@keyframes hl7x-tile {
  0%            { opacity:0; transform: scale(1.302,.604) }
  5.9%,64.29%   { opacity:1; transform: scale(1.302,.604) }
  86.86%,100%   { opacity:1; transform: scale(1,1) }
}
@keyframes hl7x-panel {
  0%,80.95%     { opacity:0 }
  97.62%,100%   { opacity:1 }
}

/* Reduced motion: skip straight to the finished mark. */
@media (prefers-reduced-motion: reduce) {
  .hl7x-mark .tile, .hl7x-mark .panel, .hl7x-mark .dim,
  .hl7x-mark .p0, .hl7x-mark .p5,
  .hl7x-mark .caret, .hl7x-mark .ha, .hl7x-mark .hb { animation: none }
  .hl7x-mark .dim   { opacity: 0 }
  .hl7x-mark .p0    { opacity:1; fill:#7ef0c8; transform: translate(190px,206px) rotate(45deg)  scale(1.3) }
  .hl7x-mark .p5    { opacity:1; fill:#7ef0c8; transform: translate(190px,206px) rotate(-45deg) scale(1.3) }
  .hl7x-mark .caret { opacity:1; fill:#7ef0c8 }
  .hl7x-mark .ha    { transform: translate(177.65px,142.05px) rotate(-41.82deg) scale(1.3) }
  .hl7x-mark .hb    { transform: translate(202.35px,142.05px) rotate(41.82deg)  scale(1.3) }
}
</style>

<rect class="tile"  x="94"  y="91"  width="192" height="192" rx="45" fill="#0b120f"/>
<rect class="panel" x="113" y="110" width="154" height="154" rx="36" fill="#101c17" stroke="#7ef0c8" stroke-opacity=".22" stroke-width="1"/>

<g class="st dim" style="--x:183px; animation-delay:.47s"><text class="ch" x="0" y="18" text-anchor="middle">~</text></g>
<g class="st dim" style="--x:220px; animation-delay:.58s"><text class="ch" x="0" y="18" text-anchor="middle">&#92;</text></g>
<g class="st dim" style="--x:257px; animation-delay:.69s"><text class="ch" x="0" y="18" text-anchor="middle">&amp;</text></g>

<rect class="st p0" x="-5.25" y="-42" width="10.5" height="84" rx="5.25" fill="#ffffff"/>
<rect class="st p5" x="-5.25" y="-42" width="10.5" height="84" rx="5.25" fill="#ffffff"/>

<g class="caret" fill="#ffffff">
  <rect class="st ha" x="-18" y="-5.25" width="36" height="10.5" rx="5.25"/>
  <rect class="st hb" x="-18" y="-5.25" width="36" height="10.5" rx="5.25"/>
</g>
</svg>
